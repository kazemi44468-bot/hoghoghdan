name: Optimize official logo
on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize_logo.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize logo without changing dimensions or transparency
        run: python scripts/optimize_logo.py
      - name: Commit optimized logo when smaller
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/logo.png
          if git diff --cached --quiet; then
            echo "No smaller lossless PNG representation was found."
          else
            git commit -m "Optimize official logo PNG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
