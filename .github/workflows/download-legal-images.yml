name: Download legal images
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/download_legal_images.py"
      - ".github/workflows/download-legal-images.yml"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download images
        run: python scripts/download_legal_images.py
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/legal/
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add locally stored legal images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
